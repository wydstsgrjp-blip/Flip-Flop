<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FLIP-FLOP – Der große Wurf</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff8e8;color:#342817;font-family:system-ui}main{max-width:560px;margin:auto;padding:20px}button,input{font:inherit;font-size:16px;border:1px solid #ad9d7c;border-radius:12px;background:#fff;color:inherit;padding:14px}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.3;cursor:default}input{width:100%;min-width:0}button:focus-visible,input:focus-visible{outline:3px solid #008b91;outline-offset:3px}.logo{display:block;border:0;background:none;text-align:center;font-weight:850;font-size:28px;padding:12px 0;margin:0 auto 22px;width:100%}.logo small{display:block;font-size:13px;font-weight:400;margin-top:6px}.home{min-height:80vh;display:flex;flex-direction:column;justify-content:center}.home .logo{font-size:40px}.stack{display:grid;gap:12px}.primary{background:#f6c66c;font-weight:700}.wide{width:100%}.card{background:white;border-radius:18px;padding:18px;margin:16px 0}.row{display:flex;gap:12px;align-items:center}.row>*{flex:1;min-width:0}.muted{color:#706653;font-size:13px}.center{text-align:center}h2{font-size:24px}#playerName{overflow-wrap:anywhere;font-size:30px;margin:12px 0 24px}#roundLabel{font-size:14px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}.grid button{font-weight:750;font-size:20px;padding:14px 0}.grid button:last-child{grid-column:3}.used{background:#b9e5c3}.selected{border:2px solid #157476;background:#d9eeee}.name{overflow-wrap:anywhere;text-align:left}.nameform{display:flex;gap:8px}.nameform input{flex:1}.pointsrow{font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}.pointsrow button{font-size:13px;padding:9px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:10px 5px;text-align:center;border-bottom:1px solid #e5dfd2}th:first-child,td:first-child{text-align:left;max-width:120px;overflow-wrap:anywhere}dialog{border:0;border-radius:18px;max-width:350px;width:90%;padding:24px;color:#342817}dialog::backdrop{background:#0006}.error{color:#a62816;font-size:14px}[hidden]{display:none!important}
</style></head><body><main>
<section id="home" class="screen home"><div class="logo">🌴 FLIP-FLOP 🎲<small>Der große Wurf</small></div><button class="primary wide" onclick="newGame()">Spiel starten</button></section>
<div id="app" hidden><button class="logo" id="appLogo" onclick="askExit()">🌴 FLIP-FLOP 🎲<small id="logoSub">Der große Wurf</small></button>
<section id="names" class="screen" hidden><h2 class="center">Spieler</h2><div id="nameList" class="stack"></div><form id="nameForm" class="nameform" hidden><input id="nameInput" maxlength="20" autocomplete="off" aria-label="Spielername" enterkeyhint="done"><button type="submit" aria-label="Name übernehmen">✓</button></form><div class="stack" style="margin-top:12px"><button id="addName" onclick="editName(-1)">Spieler hinzufügen</button><button id="namesDone" class="primary" hidden onclick="chooseYoung()">Spiel starten</button></div><p id="nameError" class="error" role="alert"></p></section>
<section id="young" class="screen" hidden><h2 class="center">Wer ist der jüngste?</h2><div id="youngList" class="stack"></div></section>
<section id="mode" class="screen stack" hidden><button onclick="startGame('classic')">Flip-Flop Classic</button><button onclick="startGame('risk')">Flip-Flop Risiko</button></section>
<section id="play" class="screen" hidden><div class="card"><div id="roundLabel" class="center"></div><h2 id="playerName" class="center"></h2><div class="pointsrow"><span>Rundenpunkte: <b id="points"></b></span><button onclick="openOverview()">Spielübersicht</button></div><p id="wagerInfo" class="muted"></p></div><div class="card"><div id="grid" class="grid"></div><p id="flipHint" class="muted" aria-live="polite"></p></div><div class="row"><button onclick="passTurn()">passen</button><button id="flipButton" onclick="markFlip()">FLIP</button></div><p id="message" class="muted" aria-live="polite"></p></section>
<section id="overview" class="screen" hidden><h2 class="center">Spielübersicht</h2><div class="card tablewrap"><table><thead id="scoreHead"></thead><tbody id="scores"></tbody></table></div><p id="overviewNote" class="center"></p><button id="overviewNext" class="primary wide" onclick="continueOverview()"></button></section>
<section id="betChoice" class="screen center" hidden><h2 id="choiceName"></h2><p id="choiceBalance" class="muted"></p><div class="stack"><button class="primary" onclick="openBet()">Wette platzieren</button><button onclick="skipBet()">keine Wette</button></div></section>
<section id="betForm" class="screen" hidden><h2 id="betName" class="center"></h2><label for="stake">Einsatz</label><input id="stake" type="number" min="1" step="1" inputmode="numeric" oninput="previewBet()"><div id="tiers" class="stack" style="margin-top:16px"></div><p id="betPreview" class="muted" aria-live="polite"></p><p id="betError" class="error" role="alert"></p><div class="row"><button id="placeBet" class="primary" onclick="placeBet()">Wette platzieren</button><button onclick="skipBet()">doch nicht wetten</button></div></section>
</div></main>
<dialog id="duplicate" oncancel="event.preventDefault()" aria-labelledby="duplicateTitle"><h2 id="duplicateTitle">Zahl doppelt</h2><p id="duplicateText"></p><div class="row"><button onclick="resolveDuplicate('out')">OUT</button><button onclick="resolveDuplicate('retry')">Nachwurf</button></div></dialog>
<dialog id="exitDialog" aria-labelledby="exitTitle"><h2 id="exitTitle">Spiel wirklich abbrechen und zur Startseite zurückkehren?</h2><div class="row"><button onclick="exitHome()">Okay</button><button onclick="cancelExit()">Abbrechen</button></div></dialog>
<script>
const $=id=>document.getElementById(id),tiers=[{name:'Glücksritter',target:79,mult:2},{name:'Abenteurer',target:94,mult:3},{name:'Draufgänger',target:103,mult:4},{name:'Pirat',target:114,mult:6}],flipValues=[4,8,12,16,24];
let names=[],editing=-1,youngest=0,mode='',players=[],turn=0,round=0,screen='home',timer=null,ended=false,roundEnded=false,selectedTier=null,duplicateNumber=null;
const total=p=>p.score.reduce((a,b)=>a+b,0)+p.betNet.reduce((a,b)=>a+b,0);
function show(id){clearTimeout(timer);timer=null;screen=id;document.querySelectorAll('.screen').forEach(e=>e.hidden=e.id!==id);$('app').hidden=id==='home';$('logoSub').textContent=mode?'Der große Wurf · '+(mode==='risk'?'Risiko':'Classic'):'Der große Wurf';window.scrollTo(0,0)}
function newGame(){names=[];players=[];mode='';ended=false;roundEnded=false;round=0;turn=0;editing=-1;$('nameForm').hidden=true;$('nameError').textContent='';drawNames();show('names')}
function drawNames(){$('nameList').replaceChildren();names.forEach((name,i)=>{let b=document.createElement('button');b.className='name';b.textContent=name;b.onclick=()=>editName(i);$('nameList').append(b)});$('addName').textContent=names.length?'weiterer Spieler':'Spieler hinzufügen';$('addName').hidden=names.length>=10;$('namesDone').hidden=names.length<2}
function editName(i){editing=i;$('nameInput').value=i<0?'':names[i];$('nameForm').hidden=false;$('nameInput').focus()}
$('nameForm').addEventListener('submit',e=>{e.preventDefault();saveName()});
function saveName(){let name=$('nameInput').value.trim();if(!name){$('nameError').textContent='Bitte einen Namen eingeben.';return false}if(name.length>20){$('nameError').textContent='Maximal 20 Zeichen.';return false}if(editing<0){if(names.length>=10)return false;names.push(name)}else names[editing]=name;$('nameForm').hidden=true;$('nameError').textContent='';drawNames();return true}
function chooseYoung(){if(!$('nameForm').hidden&&!saveName())return;if(names.length<2)return;$('youngList').replaceChildren();names.forEach((name,i)=>{let b=document.createElement('button');b.textContent=name;b.onclick=()=>{youngest=i;show('mode')};$('youngList').append(b)});show('young')}
function startGame(value){if(names.length<2||!['classic','risk'].includes(value))return;mode=value;players=names.map(name=>({name,score:[0,0,0,0],betNet:[0,0,0,0],bets:[null,null,null,null],betAsked:[true,false,false,true],seen:[new Set(),new Set(),new Set(),new Set()],flip:false,flipPending:false,out:false,passed:false}));round=0;turn=youngest;ended=false;roundEnded=false;enterTurn()}
function enterTurn(){let p=players[turn];if(mode==='risk'&&(round===1||round===2)&&!p.betAsked[round]){if(total(p)>0){$('choiceName').textContent=p.name;$('choiceBalance').textContent=total(p)+' Punkte';show('betChoice');return}p.betAsked[round]=true}renderPlay()}
function renderPlay(){let p=players[turn];$('roundLabel').textContent=round===3?'FLIP-Runde':'Runde '+(round+1);$('playerName').textContent=p.name;$('points').textContent=p.score[round];let b=p.bets[round];$('wagerInfo').hidden=!b;$('wagerInfo').textContent=b?'Einsatz '+b.stake+' · Ziel '+b.target+' · ×'+b.mult:'';$('grid').replaceChildren();for(let n=4;n<=24;n++){let button=document.createElement('button');button.textContent=n;button.className=p.seen[round].has(n)?'used':'';button.setAttribute('aria-pressed',String(p.seen[round].has(n)));button.disabled=p.flipPending&&!flipValues.includes(n);button.onclick=()=>roll(n);$('grid').append(button)}$('flipButton').classList.toggle('selected',p.flipPending);$('flipHint').hidden=!p.flipPending;$('flipHint').textContent=p.flipPending?'FLIP: 4, 8, 12, 16 oder 24 auswählen.':'';show('play')}
function markFlip(){if(screen!=='play'||duplicateNumber!==null)return;players[turn].flipPending=!players[turn].flipPending;renderPlay()}
function commitFlip(p){if(p.flipPending){p.flip=true;p.flipPending=false}}
function roll(n){if(screen!=='play'||ended||duplicateNumber!==null||!Number.isInteger(n)||n<4||n>24)return;let p=players[turn];if(p.flipPending&&!flipValues.includes(n))return;if(p.seen[round].has(n)){duplicateNumber=n;$('duplicateText').textContent='Die '+n+' wurde bereits eingetragen.';$('duplicate').showModal();return}commitFlip(p);p.seen[round].add(n);p.score[round]+=n;advance(p.name+': +'+n)}
function resolveDuplicate(choice){if(duplicateNumber===null||!['out','retry'].includes(choice))return;duplicateNumber=null;$('duplicate').close();let p=players[turn];if(choice==='out'){commitFlip(p);p.out=true;p.score[round]=0;advance(p.name+' ist OUT.')}else{$('message').textContent='Nachwurf: neue Augensumme eintragen.';renderPlay()}}
function passTurn(){if(screen!=='play'||duplicateNumber!==null)return;let p=players[turn];if(p.flipPending){$('message').textContent='FLIP-Summe eintragen oder FLIP zurücknehmen.';return}p.passed=true;advance(p.name+' passt.')}
function active(p){return !p.out&&!p.passed&&(round!==3||p.flip)}
function advance(note){$('message').textContent='';for(let k=1;k<=players.length;k++){let i=(turn+k)%players.length;if(active(players[i])){turn=i;openOverview(true,note);return}}finishRound()}
function settleBets(){players.forEach(p=>{let b=p.bets[round];if(!b||b.settled)return;p.betNet[round]=!p.out&&p.score[round]>=b.target?b.stake*(b.mult-1):-b.stake;b.settled=true})}
function finishRound(){settleBets();roundEnded=true;ended=round===3||(round===2&&!players.some(p=>p.flip));let note='Runde '+(round+1)+' beendet.';if(ended){let max=Math.max(...players.map(total));note='Spielende! '+players.filter(p=>total(p)===max).map(p=>p.name).join(', ')+' gewinnt mit '+max+' Punkten.'}openOverview(false,note)}
function drawScores(){let headers=['Spieler','1.','2.','3.','FLIP',...(mode==='risk'?['Wetten ±']:[]),'Gesamt'];$('scoreHead').replaceChildren();let hr=document.createElement('tr');headers.forEach(x=>{let th=document.createElement('th');th.textContent=x;hr.append(th)});$('scoreHead').append(hr);$('scores').replaceChildren();players.forEach(p=>{let tr=document.createElement('tr');[p.name,...p.score.map((n,i)=>i===3&&!p.flip?'–':n),...(mode==='risk'?[p.betNet.reduce((a,b)=>a+b,0)]:[]),total(p)].forEach(x=>{let td=document.createElement('td');td.textContent=x;tr.append(td)});$('scores').append(tr)})}
function openOverview(auto=false,note=''){if(duplicateNumber!==null)return;drawScores();$('overviewNote').textContent=note;$('overviewNext').textContent=ended?'zur Startseite':roundEnded?'nächste Runde':'weiter';show('overview');if(auto)timer=setTimeout(()=>{if(screen==='overview')enterTurn()},1500)}
function continueOverview(){if(screen!=='overview')return;if(ended){exitHome();return}if(roundEnded){let prior=round;round++;roundEnded=false;players.forEach(p=>{p.passed=false;p.out=round===3&&!p.flip;p.flipPending=false});let candidates=players.map((p,i)=>i).filter(i=>active(players[i]));candidates.sort((a,b)=>total(players[b])-total(players[a])||players[b].score[prior]-players[a].score[prior]);turn=candidates[0]}enterTurn()}
function openBet(){if(screen!=='betChoice')return;selectedTier=null;$('betName').textContent=players[turn].name;$('stake').value='';$('stake').max=total(players[turn]);$('stake').placeholder='max. '+total(players[turn])+' Punkte';$('betError').textContent='';$('tiers').replaceChildren();tiers.forEach((t,i)=>{let b=document.createElement('button');b.textContent=t.name+' · mindestens '+t.target+' Punkte · ×'+t.mult;b.onclick=()=>{selectedTier=i;[...$('tiers').children].forEach((x,j)=>x.classList.toggle('selected',j===i));previewBet()};$('tiers').append(b)});previewBet();show('betForm')}
function validBet(){let stake=Number($('stake').value);return Number.isSafeInteger(stake)&&stake>0&&stake<=total(players[turn])&&selectedTier!==null}
function previewBet(){let balance=total(players[turn]),stake=Number($('stake').value);$('placeBet').disabled=!validBet();$('betPreview').textContent=validBet()?'Bei Gewinn: +'+stake*(tiers[selectedTier].mult-1)+' Punkte zusätzlich. Bei OUT oder verlorener Wette bleiben '+(balance-stake)+' Punkte (ohne neue Rundenpunkte).':''}
function placeBet(){if(screen!=='betForm'||!validBet())return;let p=players[turn];p.bets[round]={stake:Number($('stake').value),...tiers[selectedTier],settled:false};p.betAsked[round]=true;renderPlay()}
function skipBet(){if(!['betChoice','betForm'].includes(screen))return;players[turn].betAsked[round]=true;renderPlay()}
function askExit(){clearTimeout(timer);$('exitDialog').showModal()}
function cancelExit(){$('exitDialog').close();if(screen==='overview'&&!roundEnded&&!ended)timer=setTimeout(enterTurn,1500)}
$('exitDialog').addEventListener('cancel',e=>{e.preventDefault();cancelExit()});
function exitHome(){clearTimeout(timer);for(let id of ['exitDialog','duplicate'])if($(id).open)$(id).close();duplicateNumber=null;players=[];names=[];mode='';ended=false;roundEnded=false;show('home')}
</script></body></html>
